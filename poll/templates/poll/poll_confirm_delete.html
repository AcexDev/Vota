{% extends 'poll/base.html' %}
{% block content %}
<form method="POST">
    {% csrf_token %}
    <legend>Delete Poll</legend>
    <h3>Are you sure you want to delete this poll: {{ object.topic }}</h3>
    {{ form }}
    <button class="btn-primary" type="submit">Yes, Delete</button>
    <a class="btn-primary" href="{% url 'poll-detail' object.id %}">Cancel</a>
</form>
{% endblock %}
